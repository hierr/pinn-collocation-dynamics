# Engineering demonstration: reduced training and evaluation budgets.
campaign: peer_review_demo
seeds:
- 0
problem:
  reference_path: data/burgers_dataset/burgers_nu_0p0031830989_N1024.npz
  x_bounds:
  - -1.0
  - 1.0
  t_bounds:
  - 0.0
  - 0.99
  viscosity: 0.003183098861837907
  interior_points: 2500
  boundary_points: 80
  initial_points: 160
network:
  layers:
  - 2
  - 64
  - 64
  - 64
  - 64
  - 1
evaluation:
  solution_nx: 256
  residual_nx: 64
  residual_nt: 40
  batch_size: 4096
training:
  phases: 1
  adam_steps: 500
  learning_rate: 0.001
  display_every: 100
  lbfgs:
    maxcor: 100
    ftol: 0.0
    gtol: 1.0e-08
    maxiter: 50
    maxfun: 75
    maxls: 50
methods:
  fixed_hammersley: {}
  random_resampling:
    period: 50
  rad:
    period: 50
    candidate_points: 100000
    k: 1
    c: 1
    batch_size: 4096
  pacmann_adam:
    period: 50
    steps: 15
    step_size: 1.0e-05
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-07
  pacmann_diffusion:
    period: 50
    steps: 15
    step_size: 1.0e-05
    betas:
    - 0.9
    - 0.999
    epsilon: 1.0e-07
    sigma: 0.0001
